name: shop-caddy

services:
  caddy:
    image: caddy:2
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile --watch
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

# Caddy owns shopnet; the apps join it to be reached.
networks:
  default:
    name: shopnet

volumes:
  caddy-data:
